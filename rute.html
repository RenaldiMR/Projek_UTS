<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Peta Rute</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="d-flex">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">

            <i class="bi bi-bus-front-fill"></i>

            <span>
                Transportasi<br>& Nebeng
            </span>

        </div>

        <hr>

        <a href="index.html" class="menu">
            <i class="bi bi-house-door-fill"></i>
            Dashboard
        </a>

        <a href="rute.html" class="menu">
            <i class="bi bi-signpost-2-fill"></i>
            Rute Transportasi
        </a>

        <a href="nebeng.html" class="menu">
            <i class="bi bi-car-front-fill"></i>
            Nebeng Kampus
        </a>

        <a href="peta.html" class="menu active">
            <i class="bi bi-map-fill"></i>
            Peta Rute
        </a>

        <a href="pengguna.html" class="menu">
            <i class="bi bi-people-fill"></i>
            Data Pengguna
        </a>

    </aside>


    <!-- CONTENT -->

    <main class="main-content">

        <nav class="topbar">

            <div>

                <h5>Peta Rute Transportasi</h5>

                <small class="text-muted">
                    Informasi lokasi dan rute menuju kampus
                </small>

            </div>

        </nav>


        <div class="card-custom">

            <h4>
                <i class="bi bi-map-fill"></i>
                Peta Rute Kampus
            </h4>

            <p class="text-muted">
                Pilih marker untuk melihat informasi lokasi.
            </p>

            <div id="map"></div>

        </div>

    </main>

</div>


<!-- Leaflet JS -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

// Membuat peta
const map = L.map('map').setView(
    [-6.914744, 107.609810],
    12
);


// Tile OpenStreetMap
L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);


// Marker Kampus
const kampus = L.marker(
    [-6.926575719409608, 107.626200665495]
).addTo(map);

kampus.bindPopup(`
    <b>Kampus</b><br>
    Tujuan utama mahasiswa.
`);


// Marker Cicaheum
const cicaheum = L.marker(
    [-6.899000, 107.650000]
).addTo(map);

cicaheum.bindPopup(`
    <b>Cicaheum</b><br>
    Titik awal rute Angkot 05.
`);


// Marker Buah Batu
const buahBatu = L.marker(
    [-6.950000, 107.630000]
).addTo(map);

buahBatu.bindPopup(`
    <b>Buah Batu</b><br>
    Titik awal rute Angkot 08.
`);


// Marker Dago
const dago = L.marker(
    [-6.880000, 107.610000]
).addTo(map);

dago.bindPopup(`
    <b>Dago</b><br>
    Titik awal rute Angkot 03.
`);


// Garis rute
const route = L.polyline(
    [
        [-6.899000, 107.650000],
        [-6.914744, 107.609810]
    ]
).addTo(map);


const route2 = L.polyline(
    [
        [-6.950000, 107.630000],
        [-6.914744, 107.609810]
    ]
).addTo(map);


const route3 = L.polyline(
    [
        [-6.880000, 107.610000],
        [-6.914744, 107.609810]
    ]
).addTo(map);

</script>


</body>
</html>
